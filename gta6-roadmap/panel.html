<title>Roadmap GTA VI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Mundo único: noche de Vice City. Atardecer (amarillo → naranja → rosa → violeta) sobre azul-violeta oscuro; tipografía condensada tipo cartel; misiones como tarjetas. Tema oscuro deliberado (se ve igual en cualquier anfitrión). */
:root{
  --bg:#110820; --bg-2:#170b2b; --surface:#1c0f33; --surface-2:#271544; --line:#3b2361;
  --fg:#fff3e8; --muted:#bfa6d8; --dim:#8c74a8;
  --yellow:#ffe02e; --orange:#ff8a3d; --pink:#ff4f8b; --magenta:#c1309e; --violet:#7b2fbf; --cyan:#38e0ff;
  --ok:#2bd47d; --bad:#ff4d5e;
  --sunset:linear-gradient(180deg,#ffe02e 0%,#ff8a3d 32%,#ff4f8b 62%,#7b2fbf 100%);
  --sunset-x:linear-gradient(90deg,#ffe02e,#ff8a3d 35%,#ff4f8b 65%,#c1309e);
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,#3a1450 0%,var(--bg) 55%) fixed,var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:26px} h3{font-size:18px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.script{font-family:var(--script);text-transform:none;letter-spacing:0}
a{color:var(--cyan)}
button,select{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* ---------- Cabecera tipo póster ---------- */
.poster{position:relative;overflow:hidden;border-radius:0 0 22px 22px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 14px;padding:22px max(16px,env(safe-area-inset-left,0px)) 18px;
  background:linear-gradient(180deg,#2a0f45 0%,#5a1a63 45%,#c1309e 78%,#ff8a3d 100%);min-height:150px}
.poster canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.poster .inner{position:relative;max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.logo{display:flex;flex-direction:column;gap:2px}
.logo .s{font-family:var(--script);font-size:30px;color:#fff;line-height:1;text-shadow:0 2px 0 #0006}
.logo h1{font-size:clamp(40px,8vw,64px);background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #1b0629)}
.logo .ch{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:.9}
.sync{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:#fff;opacity:.85}
.dot{width:8px;height:8px;border-radius:50%;background:#fff8}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.local{background:var(--yellow)}
.countdown{text-align:right;color:#fff}
.countdown .big{font-family:var(--display);font-size:56px;line-height:.9;color:var(--yellow);text-shadow:0 3px 0 #1b0629}
.countdown .t{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:12px}

/* ---------- HUD ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-block:4px 14px}
.kpi{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.02em}
.kpi .v small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700;margin-left:4px}
.bar{height:8px;background:#0006;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sunset-x);border-radius:99px}
.bar.coral>i{background:linear-gradient(90deg,var(--pink),var(--magenta))} .bar.sun>i{background:linear-gradient(90deg,var(--yellow),var(--orange))}

/* ---------- Pestañas ---------- */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding-block:10px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-family:var(--display);font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:7px 14px;border-radius:10px;border:1px solid transparent}
nav.tabs a[aria-current="page"]{background:var(--sunset-x);color:#1b0629}
nav.tabs a:hover{border-color:var(--line);color:var(--fg)}
main{padding-top:18px}
section.view{display:flex;flex-direction:column;gap:16px}

/* ---------- Genéricos ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.chip.k-content{background:#38e0ff22;color:var(--cyan)} .chip.k-product{background:#ff4f8b22;color:var(--pink)} .chip.k-promo{background:#ffe02e22;color:var(--yellow)} .chip.k-review{background:#bfa6d822;color:var(--muted)} .chip.k-setup{background:#ff8a3d22;color:var(--orange)}
.chip.ms{background:var(--sunset-x);color:#1b0629}
.chip.time{background:#0005;color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:8px 14px;border-radius:10px;font-weight:800;font-size:13px}
.btn:hover{border-color:var(--pink)}
.btn.primary{background:var(--sunset-x);border-color:transparent;color:#1b0629}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.35;cursor:default}
select.btn{appearance:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
details.fold>summary{cursor:pointer;list-style:none;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--pink);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}

/* ---------- HOY: briefing de misión ---------- */
.brief{position:relative;overflow:hidden;border-radius:20px;padding:20px;background:linear-gradient(135deg,#2b1048 0%,#4a155a 50%,#7a1f61 100%);border:1px solid #ff4f8b55;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.brief::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--sunset);opacity:.22;filter:blur(2px)}
.brief .phase{font-family:var(--script);font-size:26px;color:var(--yellow);line-height:1}
.brief .date{font-family:var(--display);font-size:clamp(44px,9vw,76px);line-height:.95;text-transform:uppercase}
.brief .date em{font-style:normal;background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent}
.brief .nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
.ring{position:relative;width:118px;height:118px;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-family:var(--display);font-size:32px;line-height:1;display:block}
.ring .lbl span{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stars{display:flex;gap:3px;margin-top:6px;font-size:18px;color:#ffffff30}
.stars .on{color:var(--yellow);text-shadow:0 0 8px #ffe02e88}
@media (max-width:560px){.brief{grid-template-columns:1fr}.ring{width:96px;height:96px;justify-self:start}}

.pubs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.pub{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cyan);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pub b{font-family:var(--display);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.plat{display:flex;gap:6px}
.plat span{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:#0006}
.plat .yt{color:#ff6b6b} .plat .tt{color:var(--cyan)} .plat .ig{color:var(--pink)}

.missions{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.mission{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:transform .12s,border-color .12s}
.mission:hover{border-color:var(--pink)}
.mission input{position:absolute;opacity:0;width:1px;height:1px}
.mission .box{width:34px;height:34px;border-radius:10px;border:2px solid var(--muted);display:grid;place-items:center;font-size:20px;color:transparent}
.mission input:focus-visible+.box{outline:3px solid var(--yellow);outline-offset:2px}
.mission.done{background:linear-gradient(90deg,#2bd47d14,var(--surface));border-color:#2bd47d66}
.mission.done .box{background:var(--ok);border-color:var(--ok);color:#06210f}
.mission.done .t{color:var(--muted);text-decoration:line-through}
.mission .t{font-weight:700;font-size:15.5px}
.mission .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mission .n{font-family:var(--display);font-size:28px;color:var(--line)}
.mission.done .n{color:var(--ok)}
.budget{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.budget .bar{flex:1}
.passed{border-radius:16px;padding:18px;text-align:center;background:#0008;border:2px solid var(--yellow)}
.passed .big{font-family:var(--display);font-size:clamp(34px,7vw,56px);background:var(--sunset);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.passed .sub{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.passed{animation:pop .4s ease-out}@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}}
.next{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- Calendario ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{font-size:12px;text-align:center;color:var(--muted);font-family:var(--display);letter-spacing:.08em}
.cell{position:relative;overflow:hidden;min-height:92px;border:1px solid var(--line);border-radius:12px;padding:7px;background:var(--surface);display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--fg);min-width:0}
.cell .fill{position:absolute;left:0;right:0;bottom:0;background:var(--sunset);opacity:.28;pointer-events:none}
.cell.full{border-color:var(--ok)} .cell.full .fill{background:var(--ok);opacity:.22}
.cell.empty{background:transparent;border-style:dashed;opacity:.35}
.cell.today{outline:3px solid var(--yellow);outline-offset:-1px}
.cell.launch{border-color:var(--pink)}
.cell .d{font-family:var(--display);font-size:22px;line-height:1;position:relative}
.cell .lbl{font-size:10.5px;line-height:1.2;color:var(--yellow);font-weight:800;position:relative;overflow:hidden}
.cell .ck{position:absolute;right:6px;top:6px;font-size:14px;color:var(--ok)}
@media (max-width:560px){.cell{min-height:62px;padding:4px}.cell .lbl{display:none}.cell .d{font-size:18px}}

/* ---------- Guiones, tracker, reglas ---------- */
details.script{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.script>summary{list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer}
details.script>summary::-webkit-details-marker{display:none}
details.script>summary b{font-family:var(--display);font-size:18px;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
details.script .body{padding:0 14px 14px;display:grid;gap:10px}
.field{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;font-size:14px}
.field b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);padding-top:2px}
@media (max-width:560px){.field{grid-template-columns:1fr}}
.voice{background:#0005;border-radius:10px;padding:10px 12px;border-left:3px solid var(--yellow)}
mark{background:transparent;color:var(--yellow);font-weight:800}
.status{margin-left:auto}
.tasks{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--pink);flex:0 0 auto}
.task label{flex:1;min-width:0;cursor:pointer}
.task.done label .t{text-decoration:line-through;color:var(--muted)}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tin{width:80px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:#0006;color:var(--fg);font-family:var(--mono);font-size:13px;text-align:right}
.tin.wide{width:150px;text-align:left;font-family:var(--body)}
.tin:focus{border-color:var(--yellow)}
tr.cur td{background:#ffe02e14}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.yesno{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.yesno ul{margin:0;padding-left:18px;display:grid;gap:6px}
.yes{border-top:4px solid var(--ok)} .no{border-top:4px solid var(--bad)}
.yes h3{color:var(--ok)} .no h3{color:var(--bad)}
.publish{border-left:4px solid var(--cyan);padding:10px 14px;background:var(--surface);border-radius:0 10px 10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--sunset-x);color:#1b0629;padding:9px 16px;border-radius:10px;font-weight:800;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .35s ease}.mission{transition:background .2s}}
</style>

 {id:"S1",date:"17/11 · 21:00",pre:1,title:"GTA VI en 30 segundos",hook:"«El jueves sale GTA VI. Esto es lo único que necesitas saber.» · Texto: FALTAN 2 DÍAS",
  voice:"Sale el jueves 19 de noviembre, solo en PS5 y Xbox Series. ¿En PC? De momento, nada anunciado. Llevas a dos protagonistas, Jason y Lucía: una pareja que huye junta. El mapa es Leonida, un estado inspirado en Florida, con Vice City como gran ciudad. Y lo más loco: el último GTA principal salió en 2013. Han pasado trece años. Si lo has reservado en digital, la precarga está abierta desde el 10 de noviembre. Desde el jueves te cuento cada día los secretos que va encontrando la comunidad.",

 {id:"S2",date:"05/12 · 11:00",pre:1,title:"Los lugares de GTA VI y su versión real",hook:"«Todos los lugares de GTA VI existen de verdad.» · Texto: ¿DÓNDE ESTÁ LEONIDA?",

 {id:"S3",date:"18/11 · 21:00",pre:1,title:"Por qué GTA VI ha tardado 13 años",hook:"«GTA VI ha tardado trece años. Y no fue por vagancia.» · Texto: 2013 → 2026",

 {id:"S4",date:"19/11 · 09:00",pre:1,title:"Jason y Lucia: quiénes son",hook:"«Hoy vas a pasar cien horas con estos dos. Esto es lo que sabemos.» · Texto: ¿QUIÉNES SON?",
  voice:"Lucia Caminos. Según la web oficial, su padre le enseñó a pelear en cuanto aprendió a andar, y defender a su familia la acabó llevando a la cárcel de Leonida; así empieza el primer tráiler [VERIFICA]. Jason Duval creció rodeado de timadores, pasó por el ejército para huir de sus problemas y acabó en los Cayos haciendo lo que mejor sabe [VERIFICA]. Juntos son la pareja que la comunidad ya llama los Bonnie y Clyde de Rockstar. Y una pregunta: ¿podrás cambiar entre ellos cuando quieras, como en GTA V? Lo sabremos en unas horas.",

  voice:"Rockstar no ha anunciado la versión de PC. Pero mira el historial. GTA IV salió en consolas en abril de 2008 y en PC en diciembre: ocho meses después. GTA V salió en 2013 en consolas y en PC en abril de 2015: diecinueve meses. Red Dead Redemption 2 salió en octubre de 2018 y en PC en noviembre de 2019: trece meses. Si se repite el patrón, GTA VI llegaría a PC entre finales de 2027 y 2028. Ojo: esto es una estimación, no es oficial. Cuando Rockstar diga algo, te aviso aquí.",

/* ============ ESTADO + PERSISTENCIA ============ */
const S={done:{},shorts:{},tracker:{},settings:{}};
let db=null, mode="loading";
const LS="archivoneon-panel-v1";
function lsLoad(){try{const x=JSON.parse(localStorage.getItem(LS)||"null");if(x)Object.assign(S,x)}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
lsLoad();

const timers={}; const writing={}; const queued={};
function schedule(key,fn,ms=500){clearTimeout(timers[key]);timers[key]=setTimeout(()=>run(key,fn),ms)}
async function run(key,fn){ if(writing[key]){queued[key]=fn;return}
  writing[key]=true; try{await fn()}catch(e){toast("No se pudo guardar en la nube. Queda guardado en este navegador.")}
  writing[key]=false; if(queued[key]){const f=queued[key];queued[key]=null;run(key,f)} }
function persistProgress(){lsSave(); if(db) schedule("progress",()=>db.doc("progress/main").set({done:S.done,shorts:S.shorts,updatedAt:new Date().toISOString()}))}
function persistDay(date){lsSave(); if(db) schedule("t"+date,()=>db.doc("tracker/"+date).set(Object.assign({date},S.tracker[date]||{})),700)}
function persistSettings(){lsSave(); if(db) schedule("settings",()=>db.doc("settings/main").set(S.settings))}

function setSync(m){mode=m;const d=document.getElementById("syncDot"),t=document.getElementById("syncTxt");
  d.className="dot"+(m==="cloud"?" on":m==="local"?" local":"");
  t.textContent=m==="cloud"?"Guardado en la nube":m==="local"?"Guardado solo en este navegador":"Conectando…"}

async function initDb(){
  const fallback=setTimeout(()=>{if(mode==="loading")setSync("local")},10000);
  try{ db = window.claude ? await window.claude.use("db") : null }catch(e){db=null}
  if(!db){clearTimeout(fallback);setSync("local");return}
  let first=true, migrated=false;
  db.doc("progress/main").onSnapshot(s=>{clearTimeout(fallback);setSync("cloud");
    const v=s.exists?s.data():null;
    if(v){S.done=Object.assign({},v.done||{});S.shorts=Object.assign({},v.shorts||{})}
    else if(first&&(Object.keys(S.done).length||Object.keys(S.shorts).length)){setTimeout(persistProgress,0)}
    first=false; lsSave(); rerender()},()=>setSync("local"));
  db.collection("tracker").onSnapshot(q=>{const t={};q.docs.forEach(d=>{const x=Object.assign({},d.data());delete x.date;t[d.id]=x});
    if(q.empty && !migrated && Object.keys(S.tracker).length){migrated=true;const keys=Object.keys(S.tracker);setTimeout(()=>keys.forEach(persistDay),0)} else S.tracker=t;
    lsSave(); rerender(true)},()=>{});
  db.doc("settings/main").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},s.data()); lsSave(); rerender()},()=>{});
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const WD=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const dt=s=>new Date(s+"T12:00:00");
const fmt=s=>{const x=dt(s);return WD[x.getDay()]+" "+String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0")};
const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const todayIso=(()=>{const t=iso(new Date());return t<START?START:t>END?END:t})();
let selDay=todayIso;
const tid=(d,i)=>d+"#"+i;
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:0};
const eur=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const big=n=>n>=1e6?(n/1e6).toFixed(1).replace(".",",")+" M":n>=1e4?Math.round(n/1e3)+" k":n.toLocaleString("es-ES");
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copiado")}catch(e){toast("No se pudo copiar: selecciona el texto a mano")}}
function dayProgress(day){const n=day.tasks.length;let k=0;day.tasks.forEach((_,i)=>{if(S.done[tid(day.d,i)])k++});return [k,n]}
function totals(){let v=0,sales=0,rev=0,promo=0,clicks=0;const last={sYT:0,sTT:0,sIG:0,hYT:0,svYT:0};
  DAYS.forEach(({d})=>{const r=S.tracker[d];if(!r)return;v+=num(r.vYT)+num(r.vTT)+num(r.vIG);sales+=num(r.sales);rev+=num(r.rev);promo+=num(r.promo);clicks+=num(r.clicks);
    ["sYT","sTT","sIG","hYT","svYT"].forEach(k=>{if(num(r[k])>0)last[k]=num(r[k])})});
  return {v,sales,rev,promo,clicks,last}}

      <div style="font-weight:600">${esc(sh?sh.title:title)}</div>
      <div class="plat">${isLong?'<span class="yt">YouTube</span>':code?'<span class="yt">YT Shorts</span><span class="tt">TikTok</span><span class="ig">Reels</span>':""}</div>

async function descargar(id){
  const v=VIDS.find(x=>x.id===id); if(!v||!v.file)return;
  let dl=null; try{dl=window.claude?await window.claude.use("downloads"):null}catch(e){}
  if(!dl){toast("La descarga no está disponible en esta vista. Abre el panel en claude.ai");return}
  toast("Preparando "+id+"…");
  try{const r=await fetch(v.file); const blob=await r.blob(); await dl.save({filename:`${v.id}-gtaoculto.mp4`,data:blob}); toast("Descargado")}
  catch(e){toast(e&&e.code==="declined"?"Descarga cancelada":"No se pudo descargar: "+(e&&e.message||"error"))}
}

V.calendario=()=>{
  const first=dt(START); const pad=(first.getDay()+6)%7; let cells="";
  ["L","M","X","J","V","S","D"].forEach(h=>cells+=`<div class="hd">${h}</div>`);
  for(let p=0;p<pad;p++)cells+=`<div class="cell empty" aria-hidden="true"></div>`;
  DAYS.forEach(day=>{const[k,n]=dayProgress(day);const x=dt(day.d);const full=k===n;
    cells+=`<button class="cell${day.d===todayIso?" today":""}${full?" full":""}${day.d===LAUNCH?" launch":""}" data-goto="${day.d}" aria-label="${fmt(day.d)}: ${k} de ${n} misiones">
      <span class="fill" style="height:${k/n*100}%"></span>${full?'<span class="ck">✓</span>':""}
      <span class="d">${x.getDate()}${x.getDate()===1||day.d===START?` <span class="muted" style="font-size:11px">${x.getMonth()===10?"nov":"dic"}</span>`:""}</span>
      ${day.ms?`<span class="lbl">${esc(day.ms)}</span>`:""}</button>`});
  const ms=DAYS.filter(d=>d.ms);
  return `<section class="view"><div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2>El mes en Leonida</h2><span class="muted" style="font-size:13px">Toca un día para ver sus misiones</span></div><div class="cal">${cells}</div></div>
   <div class="panel"><h3>Hitos</h3><div class="tablewrap" style="margin-top:10px"><table><tbody>${ms.map(d=>`<tr><td class="num" style="width:110px">${fmt(d.d)}</td><td><b>${esc(d.ms)}</b></td><td class="muted">${esc(d.pub)}</td></tr>`).join("")}</tbody></table></div></div>
   <div class="panel"><h3>Ritmo de cada bloque de 2 h</h3><p class="muted" style="margin:6px 0 0">≈ 70 min de Shorts · 35 min de guía o vídeo largo · 15 min de investigación y tracker. Horas de publicación: 14:00 y 21:00 (España + Latinoamérica).</p></div></section>`};

  const el=e.target; if(!el.classList.contains("tin"))return;
  const d=el.dataset.day,k=el.dataset.k; S.tracker[d]=Object.assign({},S.tracker[d]||{});
  if(el.value==="")delete S.tracker[d][k]; else S.tracker[d][k]=el.value;
  persistDay(d); renderHeader();
});
document.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("tin")&&route==="tracker"){setTimeout(()=>{const a=document.activeElement;if(!(a&&a.classList&&a.classList.contains("tin")))render()},0)}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.nav){const i=DAYS.findIndex(x=>x.d===selDay)+Number(b.dataset.nav); if(DAYS[i]){selDay=DAYS[i].d;render()}}
  if(b.hasAttribute("data-today")){selDay=todayIso;render()}
  if(b.dataset.dl){descargar(b.dataset.dl);return}
  if(b.dataset.cp){const [k,id]=b.dataset.cp.split(":");const v=VIDS.find(x=>x.id===id);copy(k==="t"?v.titulo:k==="d"?descDe(v):campoTags(v));return}
  if(b.dataset.openshort){const id=b.dataset.openshort;location.hash="#shorts";setTimeout(()=>{const d=document.getElementById("sc-"+id);if(d){d.open=true;d.scrollIntoView({block:"start"})}},60);return}
  if(b.dataset.goto){selDay=b.dataset.goto;location.hash="#hoy";render()}
  if(b.dataset.copy)copy(b.dataset.copy);
  if(b.dataset.copyvoice){const s=SHORTS.find(x=>x.id===b.dataset.copyvoice);copy(s.voice)}
  if(b.hasAttribute("data-copysales"))copy(SALES);
  if(b.hasAttribute("data-copyperm"))copy($("#permMsg").textContent);
  if(b.hasAttribute("data-copybio"))copy($("#bioTxt").textContent);
  if(b.dataset.name){S.settings=Object.assign({},S.settings,{channel:b.dataset.name});persistSettings();render();toast("Canal: "+b.dataset.name)}
});

function skyline(){const c=document.getElementById("skyline");if(!c)return;const r=c.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);const W=r.width,H=r.height;
  // sol con franjas
  const cx=W*0.72,cy=H*0.9,R=Math.min(110,W*0.2);const gr=g.createLinearGradient(0,cy-R,0,cy);gr.addColorStop(0,"#ffe02e");gr.addColorStop(1,"#ff4f8b");
  g.save();g.beginPath();g.arc(cx,cy,R,Math.PI,0);g.closePath();g.clip();g.fillStyle=gr;g.fillRect(cx-R,cy-R,2*R,R);
  g.globalCompositeOperation="destination-out";for(let k=0;k<6;k++){const y=cy-R*0.45+k*R*0.1;g.fillRect(cx-R,y,2*R,2+k*1.2)}g.restore();
  // edificios
  let x=0;let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};g.fillStyle="#1a0730";
  while(x<W){const w=14+rnd()*34,h=H*(0.12+rnd()*0.34);g.fillRect(x,H-h,w,h);x+=w+2}
  // palmeras
  const palm=(px,ph,s)=>{g.strokeStyle="#12041f";g.fillStyle="#12041f";g.lineWidth=4*s;g.beginPath();g.moveTo(px,H);g.quadraticCurveTo(px+10*s,H-ph*0.5,px+4*s,H-ph);g.stroke();
    for(let a=0;a<7;a++){const ang=-Math.PI+a*(Math.PI/6);g.beginPath();g.moveTo(px+4*s,H-ph);g.quadraticCurveTo(px+4*s+Math.cos(ang)*26*s,H-ph-12*s,px+4*s+Math.cos(ang)*44*s,H-ph+Math.abs(Math.sin(ang))*-6*s+16*s);g.lineWidth=5*s;g.stroke()}};
  palm(W*0.08,H*0.78,1);palm(W*0.16,H*0.6,.8);palm(W*0.93,H*0.72,.95)}
window.addEventListener("resize",()=>{clearTimeout(window._sk);window._sk=setTimeout(skyline,150)});
render(); skyline(); initDb();
</script>
