<style>
/* Layout: barra superior fija con KPIs, pestañas como "dial" de radio, contenido en columna de 1100px. Paleta "atardecer en Leonida": noche marina + coral + ámbar. */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --surface-2:#e6eeec; --line:#cfdcd9;
  --fg:#10211f; --muted:#56706b;
  --accent:#e2405a; --accent-ink:#ffffff; --sun:#c97a00; --sea:#0b8a86;
  --ok:#1f8a4c; --warn:#b26a00; --bad:#c62f3f;
  --chip:#e9f2f0;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1719; --surface:#132326; --surface-2:#1a2f33; --line:#24403f;
  --fg:#e9f3f1; --muted:#8fb0aa;
  --accent:#ff5d73; --accent-ink:#1a0a0d; --sun:#ffb547; --sea:#3cd1c8;
  --ok:#4fd18a; --warn:#ffb547; --bad:#ff6b7a; --chip:#1b3236; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1719; --surface:#132326; --surface-2:#1a2f33; --line:#24403f;
  --fg:#e9f3f1; --muted:#8fb0aa;
  --accent:#ff5d73; --accent-ink:#1a0a0d; --sun:#ffb547; --sea:#3cd1c8;
  --ok:#4fd18a; --warn:#ffb547; --bad:#ff6b7a; --chip:#1b3236; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(22px,4vw,32px);font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
a{color:var(--sea)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* Header */
header.top{padding-block:20px 12px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:4px}
.brand h1 span{color:var(--accent)}
.sync{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}
.countdown{display:flex;gap:10px;align-items:baseline}
.countdown .big{font-family:var(--display);font-size:28px;font-weight:800;color:var(--sun)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin-block:8px 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sea);border-radius:99px}
.bar.coral>i{background:var(--accent)} .bar.sun>i{background:var(--sun)}

/* Tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px 12px;border-radius:99px;border:1px solid transparent}
nav.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg)}
nav.tabs a:hover{border-color:var(--line)}
main{padding-top:18px}
section.view{display:flex;flex-direction:column;gap:16px}

/* Generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--fg);white-space:nowrap}
.chip.k-content{color:var(--sea)} .chip.k-product{color:var(--accent)} .chip.k-promo{color:var(--sun)} .chip.k-review{color:var(--muted)} .chip.k-setup{color:var(--fg)}
.chip.ms{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:8px;font-weight:700;font-size:13px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Today */
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daytitle{font-family:var(--display);font-size:22px;font-weight:800}
.tasks{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.task input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.task label{flex:1;min-width:0;cursor:pointer}
.task.done label .t{text-decoration:line-through;color:var(--muted)}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.publish{border-left:4px solid var(--sea);padding:10px 14px;background:var(--surface-2);border-radius:0 8px 8px 0}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{font-size:11px;text-align:center;color:var(--muted);font-weight:700;letter-spacing:.08em}
.cell{min-height:86px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface);display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--fg);min-width:0}
.cell.empty{background:transparent;border-style:dashed;opacity:.4}
.cell.today{outline:2px solid var(--sun)}
.cell .d{font-family:var(--mono);font-weight:600;font-size:13px}
.cell .p{height:4px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:auto}
.cell .p>i{display:block;height:100%;background:var(--ok)}
.cell .lbl{font-size:10.5px;line-height:1.25;color:var(--accent);font-weight:700;overflow:hidden}
@media (max-width:560px){.cell{min-height:64px;padding:4px}.cell .lbl{display:none}}

/* Scripts */
details.script{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.script>summary{list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer}
details.script>summary::-webkit-details-marker{display:none}
details.script .body{padding:0 14px 14px;display:grid;gap:10px}
.field{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;font-size:14px}
.field b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
@media (max-width:560px){.field{grid-template-columns:1fr}}
.voice{background:var(--surface-2);border-radius:8px;padding:10px 12px}
mark{background:transparent;color:var(--accent);font-weight:700}
.status{margin-left:auto}

/* Tracker */
.tin{width:78px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;text-align:right}
.tin.wide{width:140px;text-align:left;font-family:var(--body)}
tr.cur td{background:color-mix(in srgb,var(--sun) 12%,transparent)}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}

/* Rules */
.yesno{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.yesno ul{margin:0;padding-left:18px;display:grid;gap:6px}
.yes h3{color:var(--ok)} .no h3{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.bar>i,.cell .p>i{transition:width .3s ease}}
</style>

/* ============ ESTADO + PERSISTENCIA ============ */
const S={done:{},shorts:{},tracker:{},settings:{}};
let db=null, mode="loading";
const LS="archivoneon-panel-v1";
function lsLoad(){try{const x=JSON.parse(localStorage.getItem(LS)||"null");if(x)Object.assign(S,x)}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
lsLoad();

const timers={}; const writing={}; const queued={};
function schedule(key,fn,ms=500){clearTimeout(timers[key]);timers[key]=setTimeout(()=>run(key,fn),ms)}
async function run(key,fn){ if(writing[key]){queued[key]=fn;return}
  writing[key]=true; try{await fn()}catch(e){toast("No se pudo guardar en la nube. Queda guardado en este navegador.")}
  writing[key]=false; if(queued[key]){const f=queued[key];queued[key]=null;run(key,f)} }
function persistProgress(){lsSave(); if(db) schedule("progress",()=>db.doc("progress/main").set({done:S.done,shorts:S.shorts,updatedAt:new Date().toISOString()}))}
function persistDay(date){lsSave(); if(db) schedule("t"+date,()=>db.doc("tracker/"+date).set(Object.assign({date},S.tracker[date]||{})),700)}
function persistSettings(){lsSave(); if(db) schedule("settings",()=>db.doc("settings/main").set(S.settings))}

function setSync(m){mode=m;const d=document.getElementById("syncDot"),t=document.getElementById("syncTxt");
  d.className="dot"+(m==="cloud"?" on":m==="local"?" local":"");
  t.textContent=m==="cloud"?"Guardado en la nube":m==="local"?"Guardado solo en este navegador":"Conectando…"}

async function initDb(){
  const fallback=setTimeout(()=>{if(mode==="loading")setSync("local")},10000);
  try{ db = window.claude ? await window.claude.use("db") : null }catch(e){db=null}
  if(!db){clearTimeout(fallback);setSync("local");return}
  let first=true, migrated=false;
  db.doc("progress/main").onSnapshot(s=>{clearTimeout(fallback);setSync("cloud");
    const v=s.exists?s.data():null;
    if(v){S.done=Object.assign({},v.done||{});S.shorts=Object.assign({},v.shorts||{})}
    else if(first&&(Object.keys(S.done).length||Object.keys(S.shorts).length)){setTimeout(persistProgress,0)}
    first=false; lsSave(); rerender()},()=>setSync("local"));
  db.collection("tracker").onSnapshot(q=>{const t={};q.docs.forEach(d=>{const x=Object.assign({},d.data());delete x.date;t[d.id]=x});
    if(q.empty && !migrated && Object.keys(S.tracker).length){migrated=true;const keys=Object.keys(S.tracker);setTimeout(()=>keys.forEach(persistDay),0)} else S.tracker=t;
    lsSave(); rerender(true)},()=>{});
  db.doc("settings/main").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},s.data()); lsSave(); rerender()},()=>{});
}

const fmt=s=>{const x=dt(s);return WD[x.getDay()]+" "+String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0")};
const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const todayIso=(()=>{const t=iso(new Date());return t<START?START:t>END?END:t})();
let selDay=todayIso;
const tid=(d,i)=>d+"#"+i;
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:0};
const eur=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const big=n=>n>=1e6?(n/1e6).toFixed(1).replace(".",",")+" M":n>=1e4?Math.round(n/1e3)+" k":n.toLocaleString("es-ES");
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copiado")}catch(e){toast("No se pudo copiar: selecciona el texto a mano")}}
function dayProgress(day){const n=day.tasks.length;let k=0;day.tasks.forEach((_,i)=>{if(S.done[tid(day.d,i)])k++});return [k,n]}
function totals(){let v=0,sales=0,rev=0,promo=0,clicks=0;const last={sYT:0,sTT:0,sIG:0,hYT:0,svYT:0};
  DAYS.forEach(({d})=>{const r=S.tracker[d];if(!r)return;v+=num(r.vYT)+num(r.vTT)+num(r.vIG);sales+=num(r.sales);rev+=num(r.rev);promo+=num(r.promo);clicks+=num(r.clicks);
    ["sYT","sTT","sIG","hYT","svYT"].forEach(k=>{if(num(r[k])>0)last[k]=num(r[k])})});
  return {v,sales,rev,promo,clicks,last}}

V.tracker=()=>{
  const cols=[["pub","Publicado",1],["vYT","Vis. YT"],["vTT","Vis. TT"],["vIG","Vis. IG"],["sYT","Seg. YT"],["sTT","Seg. TT"],["sIG","Seg. IG"],["hYT","Horas YT (total)"],["svYT","Vis. Shorts 90 d"],["clicks","Clics"],["sales","Ventas"],["rev","€"],["promo","Promoción €"]];
  const t=totals();
  // chart
  const W=720,H=200,P={l:44,r:12,t:12,b:26};const vals=DAYS.map(d=>{const r=S.tracker[d.d]||{};return num(r.vYT)+num(r.vTT)+num(r.vIG)});
  const sales=DAYS.map(d=>num((S.tracker[d.d]||{}).sales));
  const maxV=Math.max(1000,...vals), niceMax=Math.pow(10,Math.floor(Math.log10(maxV)))*Math.ceil(maxV/Math.pow(10,Math.floor(Math.log10(maxV))));
  const bw=(W-P.l-P.r)/DAYS.length, y=v=>P.t+(H-P.t-P.b)*(1-v/niceMax);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Visitas diarias y ventas">`;
  [0,.5,1].forEach(f=>{const v=niceMax*f;svg+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${y(v)+3}" text-anchor="end">${big(v)}</text>`});
  DAYS.forEach((d,i)=>{const x=P.l+i*bw;svg+=`<rect x="${x+1}" y="${y(vals[i])}" width="${Math.max(1,bw-2)}" height="${H-P.b-y(vals[i])}" fill="var(--sea)" rx="2"><title>${fmt(d.d)}: ${vals[i]} visitas, ${sales[i]} ventas</title></rect>`;
    if(sales[i]>0)svg+=`<circle cx="${x+bw/2}" cy="${y(vals[i])-8}" r="${Math.min(7,3+sales[i])}" fill="var(--accent)"/>`;
    if(i%5===0)svg+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d.d.slice(8)}/${d.d.slice(5,7)}</text>`});
  svg+=`</svg>`;
  return `<section class="view">
  <div class="panel"><div class="row" style="justify-content:space-between"><h2>Tracker diario</h2><span class="muted" style="font-size:13px">Cada noche, 5 min. Seguidores = totales acumulados.</span></div>
   <div style="margin-top:10px">${svg}</div><div class="row muted" style="font-size:12px"><span class="chip k-content">■ visitas (YT + TT + IG)</span><span class="chip k-product">● días con ventas</span></div></div>
  <div class="tablewrap"><table><thead><tr><th>Fecha</th>${cols.map(c=>`<th class="${c[2]?"":"n"}">${c[1]}</th>`).join("")}</tr></thead><tbody>
  ${DAYS.map(d=>{const r=S.tracker[d.d]||{};return `<tr class="${d.d===todayIso?"cur":""}"><td class="num" style="white-space:nowrap">${fmt(d.d)}</td>${cols.map(([k,,w])=>`<td><input class="tin${w?" wide":""}" id="tr-${d.d}-${k}" data-day="${d.d}" data-k="${k}" value="${esc(r[k]??"")}" inputmode="${w?"text":"decimal"}" aria-label="${k} ${d.d}"></td>`).join("")}</tr>`}).join("")}
  <tr><td><b>Total</b></td><td></td><td class="n" colspan="3">${big(t.v)} vis.</td><td class="n" colspan="3">${big(t.last.sYT+t.last.sTT+t.last.sIG)} seg.</td><td class="n">${big(t.last.hYT)} h</td><td class="n">${big(t.last.svYT)}</td><td class="n">${t.clicks}</td><td class="n">${t.sales}</td><td class="n">${eur(t.rev)}</td><td class="n">${eur(t.promo)}</td></tr>
  </tbody></table></div>
  <div class="panel"><h3>Las 3 métricas que miras</h3><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Métrica</th><th>Bueno</th><th>Alarma</th></tr></thead><tbody>
   <tr><td>Retención a 3 s (YT «Lo vieron»)</td><td>≥ 70 %</td><td>&lt; 55 %</td></tr>
   <tr><td>Clics al enlace por cada 1.000 visitas</td><td>≥ 1 · ahora <b class="num">${t.v?(t.clicks/t.v*1000).toFixed(2).replace(".",","):"–"}</b></td><td>&lt; 0,3</td></tr>
   <tr><td>Conversión de la página (ventas ÷ clics)</td><td>≥ 3 % · ahora <b class="num">${t.clicks?(t.sales/t.clicks*100).toFixed(1).replace(".",",")+" %":"–"}</b></td><td>&lt; 1,5 %</td></tr></tbody></table></div></div>
  </section>`};

V.monetizacion=()=>{const t=totals().last;
 const prog=(cur,goal)=>`<div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,cur/goal*100)}%"></i></div><span class="muted num" style="font-size:12px">${big(cur)} / ${big(goal)}</span>`;
 const rows=[
  ["1","Guía de pago (Gumroad)","Día 7 (23/11)","Ninguno","La mayor parte",""],
  ["2","Amazon Afiliados España","Semana 4 (10/12)","Alta + 3 ventas en 180 días (compruébalo)","5-30 €",""],
  ["3","Regalos de Instagram","500 seguidores","500 seg. · España sin confirmar","Poco",prog(t.sIG,500)],
  ["4","YouTube, nivel de entrada (sin anuncios)","Semanas o meses","500 subs + 3.000 h o 3 M de visitas en Shorts","Poco",prog(t.sYT,500)],
  ["5","Patrocinios","≈ 10 k seguidores","Kit de medios + #Publicidad","0-150 € por mención",prog(Math.max(t.sYT,t.sTT,t.sIG),10000)],
  ["6","Recompensas para creadores de TikTok","10 k seguidores","10 k + 100 k visitas en 30 días + vídeos > 1 min + 18 años","Variable",prog(t.sTT,10000)],
  ["7","YouTube con anuncios — LARGO PLAZO","2027","1.000 subs + 4.000 h o 10 M en Shorts (desde el 01/02/2027: 8.000 h o 20 M)","0 € en 90 días",prog(t.sYT,1000)]];
 return `<section class="view"><div class="panel"><h2>Vías de ingreso por orden de llegada</h2><p class="muted" style="margin:4px 0 0">Las barras se llenan con los seguidores más recientes que apuntes en el tracker. Datos de terceros a 16/11/2026: compruébalos en el panel de cada app. Casi todo exige 18 años.</p></div>
 <div class="tablewrap"><table><thead><tr><th class="n">#</th><th>Vía</th><th>Cuándo</th><th>Requisito</th><th>A 90 días</th><th style="min-width:140px">Progreso</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td class="n">${r[0]}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td><td class="muted">${esc(r[3])}</td><td>${esc(r[4])}</td><td>${r[5]}</td></tr>`).join("")}</tbody></table></div>
 <div class="grid2"><div class="panel"><h3>Objetivos de ingresos (estimación)</h3><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Periodo</th><th>Pesimista</th><th>Realista</th><th>Optimista</th></tr></thead><tbody>
  <tr><td>Días 1-30</td><td>0-30 €</td><td><b>60-150 €</b></td><td>400 €+</td></tr><tr><td>Días 31-60</td><td>20 €</td><td><b>100-250 €</b></td><td>600 €+</td></tr><tr><td>Días 61-90</td><td>20 €</td><td><b>80-200 €</b></td><td>500 €+</td></tr></tbody></table></div>
  <p class="muted" style="font-size:13px;margin:8px 0 0">Embudo: 100 k visitas → 1 k visitas al perfil → 150 clics → 5-8 ventas.</p></div>
  <div class="panel"><h3>Fiscalidad</h3><p style="margin:8px 0 0">Declara los ingresos en el IRPF. En Bizkaia los gestiona la Hacienda Foral; si se vuelve habitual, puede que tengas que darte de alta como autónomo. Pregunta a una gestoría antes de facturar en serio y guarda los informes mensuales.</p></div></div></section>`};

V.preparacion=()=>{const chosen=S.settings.channel||"";
 return `<section class="view"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Preparación antes del jueves 19/11</h2><span class="chip">Canal: <b>${chosen?esc(chosen):"sin elegir"}</b></span></div><p class="muted" style="margin:4px 0 0">No he podido comprobar los @: la disponibilidad es una estimación. Compruébalo en cada app y pulsa «Elegir».</p></div>
 <div class="tablewrap"><table><thead><tr><th>Nombre</th><th>@</th><th>Disponibilidad probable</th><th>Notas</th><th></th></tr></thead><tbody>
  ${NAMES.map(([n,h,a,o])=>`<tr><td><b>${esc(n)}</b></td><td class="num">${esc(h)}</td><td>${esc(a)}</td><td class="muted">${esc(o)}</td><td><button class="btn small ${chosen===n?"primary":""}" data-name="${esc(n)}">${chosen===n?"Elegido":"Elegir"}</button></td></tr>`).join("")}</tbody></table></div>
 <div class="grid2">${SETUP.map(([k,t,items])=>`<div class="panel"><h3>${k} · ${esc(t)}</h3><ul class="tasks" style="margin-top:10px">${items.map((it,i)=>{const id="setup#"+k+i,on=!!S.done[id];return `<li class="task${on?" done":""}"><input type="checkbox" id="su-${k}${i}" data-task="${id}" ${on?"checked":""}><label for="su-${k}${i}"><span class="t">${esc(it)}</span></label></li>`}).join("")}</ul></div>`).join("")}</div>
 <div class="panel"><h3>Bio (las 3 plataformas)</h3><pre class="voice" style="white-space:pre-wrap;font-family:var(--body);margin:10px 0" id="bioTxt">🔎 Secretos, easter eggs y trucos de GTA VI
💸 Cómo hacer dinero rápido (guía 👇)
🇪🇸 Shorts nuevos cada día · Canal fan no oficial</pre><button class="btn small" data-copybio>Copiar la bio</button></div></section>`};

/* ============ ROUTER + EVENTOS ============ */
const ROUTES=["hoy","youtube","calendario","shorts","largos","producto","tracker","monetizacion","reglas","preparacion"];
let route="hoy";
function render(){
  const h=(location.hash||"").slice(1); route=ROUTES.includes(h)?h:"hoy";
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+route?"page":"false"));
  const open=[...document.querySelectorAll("details.script[open]")].map(d=>d.id);
  $("#main").innerHTML=V[route]();
  open.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true});
  renderHeader();
}
function rerender(fromTracker){
  const a=document.activeElement;
  if(a&&a.classList&&a.classList.contains("tin")){renderHeader();return}
  render();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.task){const id=el.dataset.task; if(el.checked)S.done[id]=true; else delete S.done[id]; persistProgress(); render()}
  if(el.dataset.short){S.shorts[el.dataset.short]=Number(el.value); persistProgress(); renderHeader(); toast(el.dataset.short+": "+STAT[Number(el.value)])}
});
document.addEventListener("input",e=>{
  const el=e.target; if(!el.classList.contains("tin"))return;
  const d=el.dataset.day,k=el.dataset.k; S.tracker[d]=Object.assign({},S.tracker[d]||{});
  if(el.value==="")delete S.tracker[d][k]; else S.tracker[d][k]=el.value;
  persistDay(d); renderHeader();
});
document.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("tin")&&route==="tracker"){setTimeout(()=>{const a=document.activeElement;if(!(a&&a.classList&&a.classList.contains("tin")))render()},0)}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.nav){const i=DAYS.findIndex(x=>x.d===selDay)+Number(b.dataset.nav); if(DAYS[i]){selDay=DAYS[i].d;render()}}
  if(b.hasAttribute("data-today")){selDay=todayIso;render()}
  if(b.dataset.goto){selDay=b.dataset.goto;location.hash="#hoy";render()}
  if(b.dataset.copy)copy(b.dataset.copy);
  if(b.dataset.copyvoice){const s=SHORTS.find(x=>x.id===b.dataset.copyvoice);copy(s.voice)}
  if(b.hasAttribute("data-copysales"))copy(SALES);
  if(b.hasAttribute("data-copyperm"))copy($("#permMsg").textContent);
  if(b.hasAttribute("data-copybio"))copy($("#bioTxt").textContent);
  if(b.dataset.name){S.settings=Object.assign({},S.settings,{channel:b.dataset.name});persistSettings();render();toast("Canal: "+b.dataset.name)}
});

render(); initDb();
</script>
